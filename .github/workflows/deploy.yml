name: deploy

# The standard beam-tier deploy: builds the container image, pushes it to Artifact Registry, then
# provisions this tenant (app + its Cloud SQL database, one apply — see TenantRootConfigRenderer)
# via `laravel-beam-provision`'s `splicewire:beam:provision`. No SA keys: auth is Workload Identity
# Federation impersonating `beam-provision@splicewire.iam.gserviceaccount.com` — the WIF pool
# (GCP_WORKLOAD_IDENTITY_PROVIDER below) already trusts both the splicewire and stephenr85 GitHub
# owners, so a new site under either needs no new GCP IAM setup, just this file present.
#
# Deliberately NOT gated on the `tests` workflow yet (a simplification, not a decision — see the
# gcp-cloud-run-provisioning map's "Not yet specified" for the open build-pipeline design question
# this closes only partially).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: splicewire
  GCP_REGION: us-central1
  AR_REPO: beam
  # Target-wide, not per-tenant: the splicewire org's own domain-restricted-sharing policy
  # (iam.allowedPolicyMemberDomains) rejects binding allUsers as a Cloud Run invoker — found live,
  # ticket 10. cloud-run-service's own default is true; this overrides it org-wide.
  GCP_ALLOW_UNAUTHENTICATED: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: beam-provision@splicewire.iam.gserviceaccount.com
          token_format: access_token

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Provision (app + tenant database, one apply)
        run: |
          php artisan splicewire:beam:provision \
            "${{ github.event.repository.name }}" \
            "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ github.event.repository.name }}:${{ github.sha }}" \
            --owner="${{ github.repository_owner }}" \
            --name="${{ github.event.repository.name }}" \
            --branch="${{ github.ref_name }}"
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
