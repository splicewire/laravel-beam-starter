            "name": "splicewire/laravel-beam-dev",
            "version": "dev-main",
            "source": {
                "type": "git",
                "url": "https://github.com/splicewire/laravel-beam-dev.git",
                "reference": "37a8d901e6a1a34e5f7840457e79f155a8ac1558"
            },
            "require": {
                "illuminate/console": "^11.0|^12.0|^13.0",
                "illuminate/contracts": "^11.0|^12.0|^13.0",
                "illuminate/database": "^11.0|^12.0|^13.0",
                "illuminate/support": "^11.0|^12.0|^13.0",
                "php": "^8.2",
                "spatie/laravel-package-tools": "^1.16"
            },
            "require-dev": {
                "laravel/pint": "^1.0",
                "orchestra/testbench": "^9.0|^10.0|^11.0",
                "phpunit/phpunit": "^11.0|^12.0"
            },
            "default-branch": true,
            "type": "library",
            "extra": {
                "branch-alias": {
                    "dev-main": "1.0.x-dev"
                },
                "laravel": {
                    "providers": [
                        "Splicewire\\Beam\\Dev\\BeamDevServiceProvider"
                    ]
                },
                "package-topology": {
                    "because": "beam-dev is family-BLIND by charter: it is developer tooling for the Beam family that must never learn a family type, because every consumer installs it as require-dev and a dependency upward would invert the direction the whole ladder is built on. That blindness is why the load engine takes its work through the LoadTargetSource PORT and ships no implementation of it — the adapter that reads a host's particle registries lives at beam tier, not here. Declared 2026-09-04: this package previously carried NO topology block at all, so a wrong dependency added here would have passed every lint in the estate. ENFORCED as of 2026-09-09 by tests/Topology/OwnTopologyDeclarationTest.php, which reads these globs off this file and fails if any runtime require matches one — plus a planted-violation case, so it cannot pass by matching nothing. Deliberately WITHOUT rushing/php-package-topology: that tool reads only vendored manifests, so a package's own declaration is invisible to it (measured at laravel-beam-market, whose DeclaredTopologyTest evaluates 0 rules), and it would drag a private multi-package dev chain into a package whose minimalism is the property this declaration protects.",
                    "mustNotRequire": [
                        "splicewire/*",
                        "schemastud/*",
                        "rushing/*"
                    ]
                }
            },
            "autoload": {
                "psr-4": {
                    "Splicewire\\Beam\\Dev\\": "src/"
                }
            },
            "autoload-dev": {
                "psr-4": {
                    "Splicewire\\Beam\\Dev\\Tests\\": "tests/"
                }
            },
            "scripts": {
                "test": [
                    "@php vendor/bin/phpunit"
                ],
                "pint": [
                    "@php -d memory_limit=512M vendor/bin/pint"
                ]
            },
            "license": [
                "MIT"
            ],
            "authors": [
                {
                    "name": "Stephen Rushing",
                    "email": "stephen@rushing.dev"
                }
            ],
            "description": "Developer tooling for the Beam family, require-dev and never shipped. Session-scoped scratch databases so concurrent suites stop clobbering each other — created, provisioned from SQL before the first migration, and reaped behind guards that refuse production, the app's own database, and any database another run is still connected to. Plus the wire-name reader that proves a DTO property rename moved no published key.",
            "keywords": [
                "beam",
                "database",
                "developer-tools",
                "laravel",
                "mysql",
                "postgres",
                "splicewire",
                "sqlite",
                "testing"
            ],
            "time": "2026-10-07T10:58:48+00:00"
        },
